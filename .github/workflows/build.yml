name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps

      - name: Create missing directories
        run: mkdir -p src/scrapers src/utils www js/scrapers js/utils

      - name: Build Web Assets
        run: npm run build --if-present

      - name: Prepare Capacitor Android
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          echo "// Auto-generated file" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          npx @capacitor/cli add android || true
          npx @capacitor/cli sync android || true
          npx @capacitor/cli update android || true

      - name: Override App Name & Package ID Native
        run: |
          # Ubah nama aplikasi di strings.xml
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Nama Aplikasi Baru<\/string>/g' android/app/src/main/res/values/strings.xml || true
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Nama Aplikasi Baru<\/string>/g' android/app/src/main/res/values/strings.xml || true

          # Ubah applicationId di build.gradle
          sed -i 's/applicationId ".*"/applicationId "com.gandzar.downloader"/g' android/app/build.gradle || true

      - name: Fix Kotlin Duplicate Classes
        run: |
          if [ -f "android/build.gradle" ]; then
            echo 'allprojects { configurations.all { resolutionStrategy.eachDependency { details -> if (details.requested.group == "org.jetbrains.kotlin" && (details.requested.name == "kotlin-stdlib-jdk7" || details.requested.name == "kotlin-stdlib-jdk8")) { details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:1.8.22" } } } }' >> android/build.gradle
          fi

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
